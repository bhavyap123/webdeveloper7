<html>
<head>
<meta charset="UTF-8">
<title>Hard Mini Game</title>
<style>
  body { background:#111; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
  canvas { background:#222; border:2px solid #fff; }
</style>
</head>
<body>

<canvas id="game" width="300" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = { x:140, y:360, w:20, h:20, speed:4 };
let blocks = [];
let frame = 0;
let gameOver = false;

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") player.x -= player.speed;
  if (e.key === "ArrowRight") player.x += player.speed;
});

function spawnBlock() {
  blocks.push({
    x: Math.random() * 280,
    y: -20,
    w: 20,
    h: 20,
    speed: 2 + Math.random() * 3
  });
}

function update() {
  if (gameOver) return;

  frame++;
  if (frame % 25 === 0) spawnBlock();

  ctx.clearRect(0,0,300,400);

  // Draw player
  ctx.fillStyle = "cyan";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Draw blocks
  ctx.fillStyle = "red";
  blocks.forEach(b => {
    b.y += b.speed;
    ctx.fillRect(b.x, b.y, b.w, b.h);

    // Collision
    if (b.x < player.x + player.w &&
        b.x + b.w > player.x &&
        b.y < player.y + player.h &&
        b.y + b.h > player.y) {
      gameOver = true;
      alert("Game Over! Try again.");
      location.reload();
    }
  });

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
