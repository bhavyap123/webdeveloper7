<html>
<head>
<title>Flash Sale</title>
<style>

.sale {
  background: red;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 24px;
  animation: blink 1s infinite alternate;
}

@keyframes blink {
  from { opacity: 1; }
  to { opacity: 0.5; }
}

</style>
</head>
<body>

<div class="sale">Flash Sale!</div>

</body>
</html>
