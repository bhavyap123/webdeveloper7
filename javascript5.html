<html>
<head>
<title>Java Script</title>
</head>
<body>
<script>
let score = parseInt (prompt ("Enter your score:"));
if(score >= 90){
alert("Grade A")}

else if (score  >= 80){
alert("score: B")}

else if (score  >= 70){
alert("score: C")}

else if (score  >= 60){
alert("score: B")}

else{
alert("score: F")};
</script>
</body>
</html>
