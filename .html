<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Krishna</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #001f3f; /* dark blue */
      color: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    hr {
      border: 1px solid #ffffff55;
      margin: 20px 0;
    }

    h2 {
      margin-top: 30px;
      color: #ffcc00; /* gold accent */
    }

    ol {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 10px 0;
    }

    button {
      background-color: #0074D9; /* bright blue */
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #005fa3;
    }
  </style>
</head>
